seed: 42
device: auto

data:
  csv: data/fitzpatrick17k/metadata_standardized.csv
  image_root: data/fitzpatrick17k/images
  image_size: 224
  batch_size: 32
  num_workers: 0
  val_size: 0.15
  test_size: 0.15

model:
  name: efficientnet_b0
  pretrained: true
  dropout: 0.25

training:
  epochs: 12
  learning_rate: 0.0003
  weight_decay: 0.0001
  patience: 4
  label_smoothing: 0.05

mitigation:
  mode: baseline
  # baseline | class_weighted | intersectional_sampler

fairness:
  skin_grouping: three_groups
  # three_groups => I-II, III-IV, V-VI
  bootstrap_samples: 200

output:
  dir: artifacts
